/* 나비 자세 조절: 좌우 회전 / 앞뒤 기울기 / 몸통 기울기 / 날개 벌어짐 (라디안) */
const POSE = { yaw:-0.9, pitch:-0.2, roll:-0.45, fold:0.7 };

/* ============ Three.js ============ */
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setClearColor(0xffffff,1);        // 배경 순백 고정
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35,1,0.1,200);

/* 반사용 스튜디오 환경맵: 밝은 면과 어두운 면의 대비가 은 질감을 만든다 */
(function buildEnv(){
  const env = new THREE.Scene();
  const c = document.createElement("canvas"); c.width=4; c.height=256;
  const g = c.getContext("2d"), gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,"#ffffff"); gr.addColorStop(.3,"#e2e2e2"); gr.addColorStop(.46,"#9c9c9c");
  gr.addColorStop(.5,"#161616"); gr.addColorStop(.62,"#4d4d4d"); gr.addColorStop(.8,"#aeaeae"); gr.addColorStop(1,"#2c2c2c");
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  env.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16), new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide})));
  const box = (w,h,x,y,z,i)=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:new THREE.Color().setScalar(i),side:THREE.DoubleSide}));
    m.position.set(x,y,z); m.lookAt(0,0,0); env.add(m);
  };
  box(26,7,-18,16,20,14); box(5,30,26,5,12,12); box(34,5,0,34,-8,14); box(9,9,-8,-8,28,6);
  box(3,22,-32,0,-6,10); box(12,4,14,20,26,16);
  box(6,26,-24,0,16,0); box(8,8,10,-4,30,0); box(4,30,18,0,24,0); box(20,3,0,10,30,0);   // 어두운 패널(대비용)
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env,0.01).texture;
  pm.dispose();
})();
const key = new THREE.DirectionalLight(0xffffff,1.3); key.position.set(4,6,8); scene.add(key);
const rim = new THREE.PointLight(0xffffff,1.6,0,2); rim.position.set(-6,3,6); scene.add(rim);

/* 날개 모양: s=+1 오른쪽, s=-1 왼쪽 */
function wingShape(kind,s){
  const sh = new THREE.Shape(), X = v=>v*s;
  if(kind==="upper"){            // 마름모꼴 윗날개 + 끝이 살짝 삐져나온 뾰족한 팁
    sh.moveTo(0,0.05);
    sh.bezierCurveTo(X(.3),1.2, X(1.6),2.4, X(3.1),2.85);
    sh.lineTo(X(3.7),3.2);
    sh.lineTo(X(3.5),2.45);
    sh.bezierCurveTo(X(3.4),1.5, X(3.0),.7, X(2.2),.1);
    sh.bezierCurveTo(X(1.5),-.2, X(.6),-.15, 0,0.05);
  }else{                         // 아랫날개 = 윗날개와 같은 마름모꼴을 아래로 돌려서 살짝 작게
    const th=-1.45, c=Math.cos(th), n=Math.sin(th);
    const T=(x,y)=>[X(.85*(x*c-y*n)), .85*(x*n+y*c)];
    const M=(x,y)=>sh.moveTo(...T(x,y)), L=(x,y)=>sh.lineTo(...T(x,y));
    const B=(a,b,c2,d,e,f)=>sh.bezierCurveTo(...T(a,b),...T(c2,d),...T(e,f));
    M(0,0.05);
    B(.3,1.2, 1.6,2.4, 3.1,2.85);
    L(3.7,3.2);
    L(3.5,2.45);
    B(3.4,1.5, 3.0,.7, 2.2,.1);
    B(1.5,-.2, .6,-.15, 0,0.05);
  }
  return sh;
}

/* 날개 무늬 텍스처: 가장자리 어두운 띠 + 날개맥 + 눈 무늬 → color map & bump map */
function wingTextures(kind){
  const pts = wingShape(kind,1).getPoints(90);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
  const w=maxX-minX, h=maxY-minY, W=1024, H=Math.round(W*h/w);
  const P = (x,y)=>[(x-minX)/w*W,(1-(y-minY)/h)*H];
  const O = P(0, kind==="upper"?.05:0);
  const pp = pts.map(p=>P(p.x,p.y));
  const maxR = Math.max(...pp.map(p=>Math.hypot(p[0]-O[0],p[1]-O[1])));
  const mk = ()=>{const c=document.createElement("canvas");c.width=W;c.height=H;return c;};
  const mc=mk(), m=mc.getContext("2d");
  const outline = ctx=>{ctx.beginPath();pp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();};
  const spots = kind==="upper" ? [[1.5,1.0],[2.2,1.45]] : [[1.25,-.85],[.95,-1.6]];

  m.fillStyle="#fff"; m.fillRect(0,0,W,H);
  m.save(); outline(m); m.clip();
  // 가장자리 어두운 띠
  const g1=m.createRadialGradient(O[0],O[1],maxR*.5,O[0],O[1],maxR);
  g1.addColorStop(0,"rgba(40,40,40,0)"); g1.addColorStop(.62,"rgba(40,40,40,.03)"); g1.addColorStop(1,"rgba(24,24,24,.55)");
  m.fillStyle=g1; m.fillRect(0,0,W,H);
  const g2=m.createRadialGradient(O[0],O[1],maxR*.86,O[0],O[1],maxR);
  g2.addColorStop(0,"rgba(20,20,20,0)"); g2.addColorStop(1,"rgba(14,14,14,1)");
  m.restore();
  const map = new THREE.CanvasTexture(mc); map.encoding = THREE.sRGBEncoding; map.anisotropy = 8;

  // 날개결 노멀맵: 부채꼴 골 + 완만한 곡면을 수식으로 계산 (반사 흐름이 생겨 금속 질감이 산다)
  const NW=512, NH=Math.max(64,Math.round(NW*h/w)), sc=NW/W;
  const nc=document.createElement("canvas"); nc.width=NW; nc.height=NH;
  const nctx=nc.getContext("2d"), img=nctx.createImageData(NW,NH);
  const ox=O[0]*sc, oy=O[1]*sc, K=3.2;
  const hf=(x,y)=>{const dx=x-ox,dy=y-oy,r=Math.hypot(dx,dy),th=Math.atan2(dy,dx);
    return 14*Math.sin(th*K)*Math.min(1,r/80)+0.0009*r*r;};
  for(let y=0;y<NH;y++)for(let x=0;x<NW;x++){
    const dhx=(hf(x+1,y)-hf(x-1,y))/2, dhy=(hf(x,y+1)-hf(x,y-1))/2;
    let nx=-dhx, ny=dhy, nz=1; const l=Math.hypot(nx,ny,nz); nx/=l;ny/=l;nz/=l;
    const i=(y*NW+x)*4; img.data[i]=(nx*.5+.5)*255; img.data[i+1]=(ny*.5+.5)*255; img.data[i+2]=(nz*.5+.5)*255; img.data[i+3]=255;
  }
  nctx.putImageData(img,0,0);
  const normal = new THREE.CanvasTexture(nc); normal.anisotropy = 8;
  return {map, normal, minX, minY, w, h};
}

const silverMat = t => new THREE.MeshPhysicalMaterial({
  color:0xdcdcdc, map:t.map, normalMap:t.normal, normalScale:new THREE.Vector2(1,1),
  metalness:1, roughness:0.1, clearcoat:1, clearcoatRoughness:0.04,
  envMapIntensity:2.3, side:THREE.DoubleSide
});
const bodyMat = new THREE.MeshPhysicalMaterial({color:0xdedede, metalness:1, roughness:0.14, clearcoat:1, envMapIntensity:2.2});
const darkMat = new THREE.MeshStandardMaterial({color:0x5f5f5f, metalness:1, roughness:0.25, envMapIntensity:1.6});

function wingMesh(kind,s,tex){
  const geo = new THREE.ExtrudeGeometry(wingShape(kind,s),{depth:.04,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:5,curveSegments:48});
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for(let i=0;i<pos.count;i++) uv.setXY(i,(pos.getX(i)*s-tex.minX)/tex.w,(pos.getY(i)-tex.minY)/tex.h);
  uv.needsUpdate = true;
  geo.translate(0,0,-.02);
  return new THREE.Mesh(geo,silverMat(tex));
}

const butterfly = new THREE.Group(); butterfly.rotation.order = "ZXY"; scene.add(butterfly);
const texUp = wingTextures("upper"), texLo = wingTextures("lower");
const wingR = new THREE.Group(), wingL = new THREE.Group();
[wingR,wingL].forEach((w,i)=>{
  const s = i? -1:1;
  w.position.y = .45;
  const up = wingMesh("upper",s,texUp), lo = wingMesh("lower",s,texLo);
  lo.position.z = -.045; w.add(up,lo); butterfly.add(w);
});

/* 몸통 + 더듬이 */
const body = new THREE.Group(); butterfly.add(body);
const part = (y,sx,sy,sz)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),bodyMat);m.position.y=y;m.scale.set(sx,sy,sz);body.add(m);};
part(.55,.16,.5,.16); part(-.85,.12,1.05,.12); part(1.2,.16,.16,.16);
[1,-1].forEach(s=>{
  const c = new THREE.CatmullRomCurve3([new THREE.Vector3(s*.05,1.3,0),new THREE.Vector3(s*.2,1.9,.05),new THREE.Vector3(s*.5,2.4,.1),new THREE.Vector3(s*.8,2.6,.1)]);
  body.add(new THREE.Mesh(new THREE.TubeGeometry(c,40,.016,8),darkMat));
  const tip = new THREE.Mesh(new THREE.SphereGeometry(.045,16,16),bodyMat); tip.position.set(s*.8,2.6,.1); body.add(tip);
});

/* 클릭 지점: 해당 파츠의 자식이라 날갯짓·회전을 그대로 따라감 */
const anchor = (parent,x,y,z)=>{const o=new THREE.Object3D();o.position.set(x,y,z);parent.add(o);return o;};
const anchors = { wingL:anchor(wingL,-3.2,2.4,.1), wingLo:anchor(wingL,-1.7,-2.2,.1),
                  wingR:anchor(wingR,3.2,2.4,.1),  ant:anchor(body,.8,2.6,.1) };

/* ============ 오버레이(동그라미 + 선 + 라벨) ============ */
const svg = document.getElementById("lines"), labelBox = document.getElementById("labels");
const NS = "http://www.w3.org/2000/svg", R = 9;
HOTSPOTS.forEach(h=>{
  h.path = document.createElementNS(NS,"path");
  h.g = document.createElementNS(NS,"g");
  h.pulse = document.createElementNS(NS,"circle"); h.pulse.setAttribute("r",R); h.pulse.setAttribute("class","pulse");
  h.ring = document.createElementNS(NS,"circle"); h.ring.setAttribute("r",R); h.ring.setAttribute("class","ring");
  h.dot = document.createElementNS(NS,"circle"); h.dot.setAttribute("r",2); h.dot.setAttribute("class","dot");
  h.ring.addEventListener("click",()=>openPopup(h));
  h.g.append(h.pulse,h.ring,h.dot); svg.append(h.path,h.g);
  h.btn = document.createElement("button"); h.btn.className="hsbtn"; h.btn.textContent=h.label;
  h.btn.addEventListener("click",()=>openPopup(h)); labelBox.append(h.btn);
});
const v = new THREE.Vector3();
function updateOverlay(){
  const W = innerWidth, H = innerHeight, cx = W/2;
  const spread = Math.min(W*.3, 190);
  HOTSPOTS.forEach(h=>{
    anchors[h.id].getWorldPosition(v); v.project(camera);
    const ax = (v.x+1)/2*W, ay = (1-v.y)/2*H;
    const margin = 10, bw = h.btn.offsetWidth;
    let lx = h.side>0 ? Math.max(ax+50, cx+spread) : Math.min(ax-50, cx-spread);
    lx = h.side>0 ? Math.min(lx, W-margin-bw) : Math.max(lx, margin+bw);
    const ly = Math.min(Math.max(ay+h.dy, 50), H-60);
    const ex = ax + h.side*Math.min(34, Math.abs(lx-ax)/2);
    const sx = ax + (ex>ax?R:-R)*.7, sy = ay + (ly>ay?R:-R)*.7;
    h.path.setAttribute("d",`M${sx},${sy} L${ex},${ly} L${lx},${ly}`);
    [h.pulse,h.ring,h.dot].forEach(c=>{c.setAttribute("cx",ax);c.setAttribute("cy",ay)});
    h.btn.style.transform = `translate(${h.side>0?lx:lx-bw}px,${ly-13}px)`;
  });
}

/* ============ 팝업 ============ */
const overlay = document.getElementById("overlay"), card = document.getElementById("card");
function openPopup(h){
  card.innerHTML = `<button class="close" aria-label="닫기">×</button>` + h.html;
  card.querySelector(".close").onclick = closePopup;
  overlay.classList.add("open"); card.scrollTop = 0;
}
function closePopup(){ overlay.classList.remove("open"); }
overlay.addEventListener("click",e=>{ if(e.target===overlay) closePopup(); });
addEventListener("keydown",e=>{ if(e.key==="Escape") closePopup(); });

/* ============ 드래그 회전 + 애니메이션 ============ */
let dragging=false, lx0=0, ly0=0, rotY=0, rotX=0;
canvas.addEventListener("pointerdown",e=>{dragging=true;lx0=e.clientX;ly0=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  rotY += (e.clientX-lx0)*.008; rotX = Math.max(-.7,Math.min(.7,rotX+(e.clientY-ly0)*.006));
  lx0=e.clientX; ly0=e.clientY;
});
["pointerup","pointercancel"].forEach(t=>canvas.addEventListener(t,()=>dragging=false));

function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const ppu = Math.min(44, w/8.4);                       // 1 단위당 화면 픽셀 → 나비 크기 (작게: 약 300px)
  camera.position.set(0,.2,h/(2*Math.tan(THREE.MathUtils.degToRad(17.5))*ppu));
  camera.updateProjectionMatrix();
}
addEventListener("resize",resize); resize();

const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  if(!dragging){ rotY += (Math.sin(t*.45)*.22 - rotY)*.02; rotX += (0 - rotX)*.03; }
  butterfly.rotation.set(POSE.pitch+rotX, POSE.yaw+rotY, POSE.roll+Math.sin(t*.6)*.03);
  butterfly.position.y = Math.sin(t*1.1)*.1;
  const a = POSE.fold + Math.sin(t*1.7)*.2;              // 날갯짓
  wingR.rotation.y = -a; wingL.rotation.y = a;
  butterfly.updateMatrixWorld(true);
  renderer.render(scene,camera);
  updateOverlay();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
