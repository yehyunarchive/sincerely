<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silver Butterfly</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    color-scheme:light;
    --ls:-0.6px; --lh:1.35; --k:1;
    --card-border:#d4d4d4; --card-shadow:0 4px 18px rgba(0,0,0,.07);
    --ink:#181818; --sub:#717171; --chip:#f2f2f2;
    --fy:62vh; --fx:50vw; --bw:230px;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:#fff;
    font-family:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,system-ui,sans-serif;
    letter-spacing:var(--ls);line-height:var(--lh);color:var(--ink)}
  button,input,textarea{font-family:inherit}
  button{letter-spacing:inherit;line-height:inherit}
  [data-t]{white-space:pre-line;font-size:calc(var(--fs,12px)*var(--m,1));letter-spacing:-0.3px}
  .title[data-t],.word[data-t]{letter-spacing:calc(var(--lsb,-.02em) + var(--sp,0px))}
  [data-t="kicker"]::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;
    background:#b8b8b8;margin-right:.6em;vertical-align:baseline}
  .pr{font-style:normal;font-size:1em;font-weight:inherit;line-height:inherit;color:inherit}
  .pr:first-child{margin-right:.4em}
  .pr:last-child{margin-left:.4em}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1}
  canvas#gl:active{cursor:grabbing}
  #contact{position:fixed;z-index:0;left:var(--fx);top:calc(var(--fy) - 7px);width:calc(var(--bw)*.7);height:14px;
    transform:translateX(-50%);background:radial-gradient(closest-side,rgba(90,90,90,.32),transparent);pointer-events:none}
  #fade{display:none}
  #hair{position:fixed;z-index:3;left:24%;right:24%;top:var(--fy);height:1px;pointer-events:none;
    background:linear-gradient(90deg,transparent,#e4e4e4 30%,#e4e4e4 70%,transparent)}
  canvas#shards{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
  svg#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  svg#lines path{fill:none;stroke:#d2d2d2;stroke-width:.8}
  svg#lines .dot{fill:#9f9f9f}
  svg#lines .ring{fill:rgba(255,255,255,.55);stroke:#c8c8c8;stroke-width:.8;pointer-events:all;cursor:pointer;
    filter:drop-shadow(0 0 5px rgba(200,200,200,.7))}
  svg#lines .ring,svg#lines .pulse,svg#lines .dot{display:none}
  svg#lines .pulse{fill:none;stroke:rgba(180,180,180,.5);stroke-width:.8;transform-box:fill-box;transform-origin:center;
    animation:pulse 2.8s ease-out infinite}
  @keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(2.4);opacity:0}}
  /* 버튼: 배경 불투명도 .3 (적당히 남김), 블러 없음 */
  .hsbtn{position:fixed;z-index:5;left:0;top:0;
    border:1px solid transparent;
    background:rgba(255,255,255,.3);
    -webkit-backdrop-filter:none;backdrop-filter:none;
    color:#858585;font-size:calc(10.5px*var(--k));font-weight:400;letter-spacing:-.2px;
    padding:calc(5px*var(--k)) calc(12px*var(--k));border-radius:999px;cursor:pointer;white-space:nowrap;
    box-shadow:none;
    transition:color .25s,border-color .25s}
  /* 테두리만 살짝 블러 (글자는 선명) */
  .hsbtn::before{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid rgba(170,170,170,.6);
    filter:blur(.3px);pointer-events:none;transition:border-color .25s}
  .hsbtn:hover,.hsbtn:focus-visible{color:#555;background:rgba(255,255,255,.5);outline:none}
  .hsbtn:hover::before,.hsbtn:focus-visible::before{border-color:rgba(130,130,130,.75)}
  .top,.foot{position:fixed;z-index:0;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 44px));pointer-events:none;color:#5b5b5b;font-weight:500}
  .top{top:calc(env(safe-area-inset-top,0px) + 20px)}
  .foot{bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .dmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;--fs:calc(11px*var(--k))}
  .dmeta>:last-child{--fs:calc(9px*var(--k));text-align:right}
  .hero{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:9px}
  .title{--fs:clamp(38px,12.6vw,86px);--lsb:-.065em;font-weight:900;line-height:.86;color:#151515;text-shadow:0 0 7px rgba(200,200,200,.55)}
  .side{--fs:calc(9px*var(--k));line-height:1.35;text-align:right;padding-top:2px}
  .tags{display:flex;align-items:center;gap:10px;margin-top:10px;--fs:calc(12px*var(--k))}
  .tags .note{margin-left:auto;text-align:right;--fs:calc(9.5px*var(--k))}
  .frow{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
  .fl,.fr{--fs:calc(10.5px*var(--k))}
  .fl{position:relative}
  #wc{position:absolute;pointer-events:none}
  .fr{text-align:right}
  .word{--fs:clamp(24px,7.4vw,38px);--lsb:-.055em;font-weight:800;line-height:1;margin:9px 0 7px;color:transparent}
  .desc{--fs:calc(9.5px*var(--k));--lsb:0px;font-weight:400;line-height:1.55;color:#7b7b7b;max-width:215px}
  .overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(255,255,255,.1);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .overlay.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{position:relative;width:300px;max-width:100%;max-height:84vh;overflow:auto;letter-spacing:-0.4px;line-height:1.35;
    background:rgba(255,255,255,.4);background-clip:padding-box;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    font-size:8.5px;color:#3b3b3b;
    border:1px solid rgba(190,190,190,.3);border-radius:14px;
    box-shadow:0 0 8px rgba(205,205,205,.25);padding:20px 20px 18px}
  .overlay.open .card{animation:pop .22s ease}
  @keyframes pop{from{transform:translateY(6px) scale(.98)}to{transform:none}}
  .close{position:absolute;top:8px;right:9px;width:26px;height:26px;border:0;background:transparent;
    font-size:18px;line-height:1;color:var(--sub);cursor:pointer;border-radius:7px}
  .close:hover{background:var(--chip)}
  .card .meta{margin-bottom:11px;padding-right:24px;display:block}
  .card .id-row{margin-bottom:10px}
  .card .label{font-size:8.5px;color:#999;letter-spacing:-0.4px;margin-bottom:2px;font-weight:500}
  .card .para{margin-bottom:9px}
  .card .para .n{font-size:inherit}
  .card .ln{line-height:1.35;margin-bottom:6px}
  .card hr{border:0;border-top:1px solid #3b3b3b;margin:11px 0 12px}
  .card .two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .card .tag{background:#3b3b3b;color:#fff;padding:.2px 2.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .card .g{font-size:9px;color:#999}
  .card b{font-weight:700}
  .card>:last-child{margin-bottom:0}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.card{text-rendering:geometricPrecision;font-kerning:none;font-feature-settings:"kern" 0,"calt" 0,"liga" 0;-webkit-font-smoothing:antialiased}
.card .hl{background-image:linear-gradient(rgba(200,200,200,.6),rgba(200,200,200,.6));background-repeat:no-repeat;background-position:0 100%;background-size:0 50%;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:hlDraw .7s .25s cubic-bezier(.4,0,.2,1) forwards}
.card .u{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:uDraw .6s .25s cubic-bezier(.4,0,.2,1) forwards}
@keyframes hlDraw{to{background-size:100% 50%}}
@keyframes uDraw{to{background-size:100% 1px}}
.card .gy{color:#a3a3a3}
.card .al{display:grid;grid-template-columns:auto 1fr auto;column-gap:6px;align-items:baseline}
.card .al.hc{grid-template-columns:1fr auto 1fr}
.card .al>.seg{grid-row:1}
.card .al>.seg[data-p="l"]{grid-column:1;text-align:left}
.card .al>.seg[data-p="c"]{grid-column:2;text-align:center}
.card .al>.seg[data-p="r"]{grid-column:3;text-align:right}
.card .al.vl>.seg+.seg,.card .two.vl>div+div{border-left:1px var(--vs,solid) var(--vc,#3b3b3b)}
.card .al.vl>.seg+.seg{padding-left:8px}
.card .two.vl>div+div{padding-left:12px}
.card .vl-l{--vc:#d0d0d0}
.card .vl-d{--vs:dotted}
.card .al.ld::after{content:"";grid-column:2;grid-row:1;align-self:center;border-top:1px dotted #aaa;margin:0 2px}
.card hr.h-l{border-top-color:#d0d0d0}
.card hr.h-d{border-top-style:dashed}
.card hr.h-ld{border-top:1px dashed #cfcfcf}
.card hr.h-s{width:26px}
.card .sl{display:inline-block;transform:skewX(-14deg);transform-origin:0 100%}
@media (prefers-reduced-motion:reduce){.card .hl{background-size:100% 50%!important}.card .u{background-size:100% 1px!important}}

/* 모바일 글자 자동 확대 방지 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.card,.card *{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* 팝업 자간·행간 강제 고정 */
.card,
.card *:not(.close){
  letter-spacing:-0.65px !important;
  line-height:1.35 !important;
}

/* chip2 얇은 검은 네모 테두리 */
.fr [data-t="chip2"]{
  display:inline-block;
  border:1px solid #181818;
  padding:3px 8px;
  border-radius:0;
  line-height:1.2;
}

/* 스캔 라인: 블러 처리된 회색 띠 (움직임은 아래 스크립트에서 처리) */
#scan{
  position:fixed;z-index:0;left:0;right:0;top:0;height:90px;
  pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(150,150,150,0) 0%,
    rgba(150,150,150,.04) 30%,
    rgba(130,130,130,.09) 44%,
    rgba(120,120,120,.17) 50%,
    rgba(130,130,130,.09) 56%,
    rgba(150,150,150,.04) 70%,
    rgba(150,150,150,0) 100%);
  filter:blur(20px);
  will-change:transform;
  transform:translate3d(0,-12vh,0);
}
</style>
</head>
<body>
<div id="contact"></div>
<div id="scan"></div>
<canvas id="gl"></canvas>
<div id="fade"></div>
<div id="hair"></div>
<canvas id="shards"></canvas>
<svg id="lines"></svg>
<div id="labels"></div>
<div class="top">
  <div class="dmeta"><span data-t="kicker"></span><span data-t="issue"></span><span data-t="date"></span></div>
  <div class="hero"><h1 class="title" data-t="title"></h1><div class="side" data-t="sub"></div></div>
  <div class="tags"><span data-t="tagA"></span><span data-t="tagB"></span><span class="note" data-t="sideNote"></span></div>
</div>
<div class="foot">
  <div class="frow">
    <div class="fl"><div data-t="badge"></div><div class="word" data-t="wordmark"></div><p class="desc" data-t="desc"></p><canvas id="wc"></canvas></div>
    <div class="fr"><div data-t="chip2"></div></div>
  </div>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="card" id="card"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

예현 CP 아니면 흐린 눈 O)<\/span><\/p>\n<p class=\"para\" style=\"line-height: 1.35; letter-spacing: -0.4px;\">⑷ <b>개인 봇 언급<\/b> 잦습니다 해당 문화에 부정적인 인식 가지고 있으실 경우 연결 X<\/p>"},{"label":"(2) caution","html":"<div class=\"meta\" style=\"line-height: 1.35; letter-spacing: -0.4px;\"><\/div><span class=\"fs\" style=\"font-size: 8.5px;\"><div class=\"meta\" style=\"line-height: 1.35; letter-spacing: -0.4px; text-align: right;\"><br><\/div><div class=\"meta\" style=\"line-height: 1.35; letter-spacing: -0.4px; margin-bottom: 1px;\"><span style=\"letter-spacing: -0.4px; -webkit-text-size-adjust: 100%;\">¹ <\/span><span class=\"hl\" style=\"letter-spacing: -0.4px; -webkit-text-size-adjust: 100%;\">이예현이 포함된 모든 커플링<\/span><br><\/div><div class=\"meta\" style=\"margin-bottom: 1px; line-height: 1.35; letter-spacing: -0.4px;\">² <b>사찰 및 반복적인 계정 방문으로 트윗 조회수 늘리기<\/b><\/div><div class=\"meta\" style=\"margin-bottom: 1px; line-height: 1.35; letter-spacing: -0.4px;\">³ AI 채팅 소비 및 그와 관련된 계정과의 연결<\/div><div class=\"meta\" style=\"margin-bottom: 1px; line-height: 1.35; letter-spacing: -0.4px;\"><span style=\"letter-spacing: -0.4px; -webkit-text-size-adjust: 100%;\">⁴ 캐릭터 선점용 드림 <span class=\"gy\">내지는 친목질 목적 드림<\/span><\/span><\/div><div style=\"line-height: 1.35; letter-spacing: -0.4px;\"><br><\/div><div style=\"line-height: 1.35; letter-spacing: -0.4px;\">상기 내용 외에는 팔안굽 성향으로 보편적인 도덕 윤리를 위반하는 수준이 아닐 경우 대부분 흐린 눈 합니다 <b>그러나 반복될 경우 불시에 정리할 가능성 존재<\/b><\/div><div style=\"line-height: 1.35; letter-spacing: -0.4px;\"><b><br><\/b><\/div><div style=\"line-height: 1.35; letter-spacing: -0.4px;\"><b><br><\/b><\/div><div style=\"line-height: 1.35; letter-spacing: -0.4px; text-align: right;\"><b>NG <\/b>해당 사유들로 인한 이별의 경우 재연결 거부<\/div><\/span><div style=\"line-height: 1.35; letter-spacing: -0.4px;\"><b><\/b><\/div>"},{"label":"(3) 名1","html":"<div class=\"meta\" style=\"line-height: 1.35; letter-spacing: -0.4px;\"><br><\/div><div class=\"meta\" style=\"line-height: 1.35; letter-spacing: -0.4px;\">애정하는 인연이 있어 받지 않으 function renderScatter(){

  wc.style.visibility=w.style.visibility;

  const fs=parseFloat(cs.fontSize);

  const sp=parseFloat(cs.letterSpacing)||0, lines=w.textContent.split("\n"), lh=parseFloat(cs.lineHeight)||fs;
  lines.forEach((ln,i)=>{ let x=pad; const y=pad+lh*i+lh*.5+fs*.35; for(const ch of ln){ c.fillText(ch,x,y); x+=c.measureText(ch).width+sp; } });
  if(R<=.2) return;

  const cell=Math.max(1,Math.round(1.5/Math.max(.2,FX.grain))), RR=R*D;
  for(let y=0;y<Hp;y++)for(let x=0;x<Wp;x++){
    const cx=Math.floor(x/cell), cy=Math.floor(y/cell);
    const sx=Math.min(Wp-1,Math.max(0,Math.round(x+(rnd(cx,cy)-.5)*2*RR)));

  }

}

    const M=(x,y)=>sh.moveTo(...T(x,y)), L=(x,y)=>sh.lineTo(...T(x,y));

(function(){

    {a:6.2, b:2.7, rx:.05,  rz:0,    o:.26, spin:.15,  pl:[{r:.08, sp:.30,  ph:2.5}]}
  ];
  defs.forEach(d=>{

    const pivot = new THREE.Group(); orbit.add(pivot);

function setPose(b,rx,ry,t,a,py=0){
  b.root.rotation.set(POSE.pitch+rx, POSE.yaw+ry, POSE.roll+Math.sin(t*.6)*.03);
  b.root.position.y = py;

let FLOOR_Y = 1e9, FLOOR_X = 0;
(function findFloor(){
  const p = new THREE.Vector3();
  [-.22,0,.22].forEach(ry=>[.5,.7,.9].forEach(a=>{
    setPose(main,0,ry,0,a); main.root.updateMatrixWorld(true);
    let minY=1e9,minX=0;
    main.root.traverse(o=>{
      if(!o.isMesh) return;
      const pa=o.geometry.attributes.position;
      for(let i=0;i<pa.count;i+=2){ p.fromBufferAttribute(pa,i).applyMatrix4(o.matrixWorld); if(p.y<minY){minY=p.y;minX=p.x;} }
    });
    if(minY<FLOOR_Y) FLOOR_Y=minY;
    if(ry===0&&a===.7) FLOOR_X=minX;
  }));
  FLOOR_Y -= 0.12;
  mirrorRoot.scale.set(1,-1,1);

})();
const lowPts = [], tv = new THREE.Vector3();
(function(){
  const sp = new THREE.SphereGeometry(1,12,8).attributes.position;
  main.root.traverse(o=>{
    if(!o.isMesh) return;
    const g=o.geometry, pr=g.parameters, pts=[];
    if(g.type==="SphereGeometry" && pr.radius===1) for(let i=0;i<sp.count;i++) pts.push(new THREE.Vector3().fromBufferAttribute(sp,i));
    else if(g.type==="ExtrudeGeometry") [].concat(pr.shapes).forEach(s=>s.getPoints(40).forEach(p=>pts.push(new THREE.Vector3(p.x,p.y,0))));
    if(pts.length) lowPts.push([o,pts]);
  });
})();
function lowestY(){
  let m=1e9;
  for(const [o,pts] of lowPts) for(const p of pts){ tv.copy(p).applyMatrix4(o.matrixWorld); if(tv.y<m) m=tv.y; }
  return m;
}
const anchor = (parent,x,y,z)=>{const o=new THREE.Object3D();o.position.set(x,y,z);parent.add(o);return o;};

const shardCanvas = document.getElementById("shards"), sctx = shardCanvas.getContext("2d");
let SW = 0, SH = 0, DPR = 1;
const shards = [];
function makeShard(initial){
  const depth = Math.random();
  const size  = 2.2 + depth*depth*7 + Math.random()*2.2;
  const rr = Math.random, sq = .22 + rr()*.38;
  const pts = [
    [(rr()-.5)*size*.9,  -size*(.9 + rr()*.9)],
    [ size*sq*(.35 + rr()*.8), (rr()-.35)*size*.8],
    [(rr()-.5)*size*.7,   size*(.4 + rr()*.9)],
    [-size*sq*(.3 + rr()*.8), (rr()-.65)*size*.8]
  ];
  const vy = SHARD.minV + depth*(SHARD.maxV-SHARD.minV);
  const s = { depth, size, pts, vy, vx:vy*SHARD.wind, rot:Math.random()*Math.PI*2,
              spin:(Math.random()<.5?-1:1)*(.25+Math.random()*.9), ph:Math.random()*Math.PI*2,
              flip:.6+Math.random()*1.2, alpha:.55+depth*.45, x:0, y:0 };
  placeShard(s,initial); return s;
}
function placeShard(s,initial){
  const drift = Math.abs(SHARD.wind)*SH;
  const xMin = SHARD.wind<0 ? 0 : -drift, xMax = SHARD.wind<0 ? SW+drift : SW;
  s.x = xMin + Math.random()*(xMax-xMin);
  s.y = initial ? Math.random()*SH : -s.size*2 - Math.random()*SH*.25;
}
function initShards(){
  shards.length = 0;
  for(let i=0;i<SHARD.count;i++) shards.push(makeShard(true));
  shards.sort((a,b)=>a.depth-b.depth);
}
function applyFX(){
  const mk = `linear-gradient(to bottom,#000 calc(var(--fy) + 4px),rgba(0,0,0,${(.6*FX.refl).toFixed(3)}) calc(var(--fy) + 4px),rgba(0,0,0,${(.24*FX.refl).toFixed(3)}) calc(var(--fy) + (100vh - var(--fy))*.3),transparent calc(var(--fy) + (100vh - var(--fy))*.64))`;
  canvas.style.webkitMaskImage = canvas.style.maskImage = mk;
  renderScatter();
  if(FX.count!==shards.length){ SHARD.count=FX.count; initShards(); }
}
function stepShards(dt,t){
  sctx.clearRect(0,0,shardCanvas.width,shardCanvas.height);
  for(const s of shards){
    s.y += s.vy*dt; s.x += s.vx*dt + Math.sin(t*.7+s.ph)*7*dt; s.rot += s.spin*dt;
    if(s.y - s.size*2 > SH || s.x < -s.size*3 || s.x > SW+SH*Math.abs(SHARD.wind)+s.size*3){ placeShard(s,false); }
    const edge = Math.min(1, Math.max(0,(SH-s.y)/(SH*.14)), Math.max(0,(s.y+s.size*2)/(SH*.08)));
    const a = s.alpha*edge; if(a<=.01) continue;
    const fl = Math.max(.3, Math.abs(Math.cos(t*s.flip+s.ph)));
    sctx.save();
    sctx.translate(s.x*DPR, s.y*DPR); sctx.rotate(s.rot); sctx.scale(fl*DPR, DPR);
    sctx.beginPath();
    s.pts.forEach((p,i)=>i?sctx.lineTo(p[0],p[1]):sctx.moveTo(p[0],p[1])); sctx.closePath();
    const sd = (1.5+s.size*.32)*DPR;
    sctx.shadowColor = `rgba(110,110,110,${.42*a})`;
    sctx.shadowBlur = (2.5+s.size*.4)*DPR*FX.shade;
    sctx.shadowOffsetX = -Math.sin(s.rot)*sd; sctx.shadowOffsetY = Math.cos(s.rot)*sd;
    sctx.fillStyle = `rgba(255,255,255,${a})`; sctx.fill();
    sctx.restore();
  }
}

const v = new THREE.Vector3();
function updateOverlay(){
  const W = innerWidth, H = innerHeight, cx = W/2;
  const spread = Math.min(W*.3, 190);
  HOTSPOTS.forEach(h=>{
    anchors[h.id].getWorldPosition(v); v.project(camera);
    const ax = (v.x+1)/2*W, ay = (1-v.y)/2*H;
    const margin = 10, bw = h.btn.offsetWidth;
    let lx = h.side>0 ? Math.max(ax+50, cx+spread) : Math.min(ax-50, cx-spread);
    lx = h.side>0 ? Math.min(lx, W-margin-bw) : Math.max(lx, margin+bw);
    const ly = Math.min(Math.max(ay+h.dy, 50), H-60);
    const ex = ax + h.side*Math.min(34, Math.abs(lx-ax)/2);
    const sx = ax + (ex>ax?R:-R)*.7, sy = ay + (ly>ay?R:-R)*.7;
    h.path.setAttribute("d",`M${sx},${sy} L${ex},${ly} L${lx},${ly}`);
    [h.pulse,h.ring,h.dot].forEach(c=>{c.setAttribute("cx",ax);c.setAttribute("cy",ay)});
    h.btn.style.transform = `translate(${h.side>0?lx:lx-bw}px,${ly-h.btn.offsetHeight/2}px)`;
  });

function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const ppu = Math.min(38, w/12.4, h/17);
  const dist = h/(2*Math.tan(THREE.MathUtils.degToRad(17.5))*ppu);
  camera.position.set(0, FLOOR_Y*.3, dist);
  camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  const f = new THREE.Vector3(FLOOR_X,FLOOR_Y,0).project(camera);
  const S = document.documentElement.style;
  S.setProperty("--fy",((1-f.y)/2*h)+"px"); S.setProperty("--fx",((f.x+1)/2*w)+"px");
  S.setProperty("--bw",(7.4*ppu)+"px");
  S.setProperty("--k", Math.min(1, Math.max(.88, w/640)).toFixed(3));
  DPR = Math.min(devicePixelRatio,2); SW = w; SH = h;
  shardCanvas.width = Math.round(w*DPR); shardCanvas.height = Math.round(h*DPR);
  if(!shards.length && SHARD.count>0) initShards();
}

let last = performance.now();
const t0 = last;
function tick(now){

  if(!dragging){ rotY += (Math.sin(t*.45)*.22 - rotY)*.02; rotX += (0 - rotX)*.03; }
  const a = POSE.fold + Math.sin(t*1.7)*.2;
  setPose(main,rotX,rotY,t,a,0); main.root.updateMatrixWorld(true);
  const py = FLOOR_Y + .12 + (Math.sin(t*1.1)+1)*.05 - lowestY();
  setPose(main,rotX,rotY,t,a,py); setPose(mir,rotX,rotY,t,a,py);
  main.root.updateMatrixWorld(true);
  orbit.position.copy(main.root.localToWorld(_ov.copy(ORBIT_C)));
  orbit.quaternion.copy(main.root.quaternion);
  ORBIT_RINGS.forEach(r=>{ r.pivot.rotation.y = t*r.spin; });
  orbit.updateMatrixWorld(true);
  let omin = 1e9;
  ORBIT_RINGS.forEach(r=>r.pts.forEach(q=>{ _ov.copy(q).applyMatrix4(r.ring.matrixWorld); if(_ov.y<omin) omin=_ov.y; }));
  if(omin < FLOOR_Y + .5) orbit.position.y += FLOOR_Y + .5 - omin;
  ORBIT_PL.forEach(p=>{ const th=p.ph+t*p.sp; p.m.position.set(Math.cos(th)*p.a,0,Math.sin(th)*p.b); });
  glint1.position.set(Math.cos(t*.5)*7, 3+Math.sin(t*.7)*3, 6);
  glint2.position.set(-Math.cos(t*.4+2)*7, -1+Math.sin(t*.6)*2, 5);
  renderer.render(scene,camera);
  stepShards(dt,t);
  updateOverlay();
  requestAnimationFrame(tick);
}
