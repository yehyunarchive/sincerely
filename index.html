<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silver Butterfly</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    color-scheme:light;
    --ls:-0.6px; --lh:1.35; --k:1;
    --card-border:#d4d4d4; --card-shadow:0 4px 18px rgba(0,0,0,.07);
    --ink:#181818; --sub:#717171; --chip:#f2f2f2;
    --fy:62vh; --fx:50vw; --bw:230px;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:#fff;
    font-family:"Pretendard Variable","Pretendard",-apple-system,system-ui,sans-serif;
    letter-spacing:var(--ls);line-height:var(--lh);color:var(--ink)}
  button,input,textarea{font-family:inherit}
  button{letter-spacing:inherit;line-height:inherit}
  /* 일반 글자 자간 -0.3px (큰 제목·워드마크는 기존 자간 유지) */
  [data-t]{white-space:pre-line;font-size:calc(var(--fs,12px)*var(--m,1));letter-spacing:-0.3px}
  .title[data-t],.word[data-t]{letter-spacing:calc(var(--lsb,-.02em) + var(--sp,0px))}

  /* 좌측 상단 Eternity 옆 회색 동그라미 */
  [data-t="kicker"]::before{content:"";display:inline-block;width:.7em;height:.7em;border-radius:50%;
    background:#b8b8b8;margin-right:.6em;vertical-align:baseline}
  /* ( unlessfarewell ) 괄호: 바로 서고 가늘게, 영어만 기울임 */
  .pr{font-style:normal;font-size:1em;font-weight:inherit;line-height:inherit;color:inherit}
  .pr:first-child{margin-right:.4em}
  .pr:last-child{margin-left:.4em}

  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1}
  canvas#gl:active{cursor:grabbing}
  #contact{position:fixed;z-index:0;left:var(--fx);top:calc(var(--fy) - 7px);width:calc(var(--bw)*.7);height:14px;
    transform:translateX(-50%);background:radial-gradient(closest-side,rgba(90,90,90,.32),transparent);pointer-events:none}
  #fade{display:none}
  #hair{position:fixed;z-index:3;left:8%;right:8%;top:var(--fy);height:1px;pointer-events:none;
    background:linear-gradient(90deg,transparent,#ccc 22%,#ccc 78%,transparent)}
  canvas#shards{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

  svg#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  svg#lines path{fill:none;stroke:#d2d2d2;stroke-width:.8}
  svg#lines .dot{fill:#9f9f9f}
  svg#lines .ring{fill:rgba(255,255,255,.55);stroke:#c8c8c8;stroke-width:.8;pointer-events:all;cursor:pointer;
    filter:drop-shadow(0 0 5px rgba(200,200,200,.7))}
  svg#lines .pulse{fill:none;stroke:rgba(180,180,180,.5);stroke-width:.8;transform-box:fill-box;transform-origin:center;
    animation:pulse 2.8s ease-out infinite}
  @keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(2.4);opacity:0}}
  .hsbtn{position:fixed;z-index:5;left:0;top:0;
    border:1px solid rgba(180,180,180,.55);background:rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    color:#858585;font-size:calc(10.5px*var(--k));font-weight:400;letter-spacing:-.2px;
    padding:calc(5px*var(--k)) calc(12px*var(--k));border-radius:999px;cursor:pointer;white-space:nowrap;
    box-shadow:0 0 14px rgba(205,205,205,.55);transition:color .25s,border-color .25s,background .25s}
  .hsbtn:hover,.hsbtn:focus-visible{color:#555;border-color:rgba(140,140,140,.7);background:rgba(255,255,255,.85);outline:none}
  .top,.foot{position:fixed;z-index:0;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 44px));pointer-events:none;color:#5b5b5b;font-weight:500}
  .top{top:calc(env(safe-area-inset-top,0px) + 20px)}
  .foot{bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .dmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;--fs:calc(11px*var(--k))}
  .dmeta>:last-child{--fs:calc(9px*var(--k));text-align:right}
  .hero{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:9px}
  .title{--fs:clamp(38px,12.6vw,86px);--lsb:-.065em;font-weight:900;line-height:.86;color:#151515;text-shadow:0 0 7px rgba(200,200,200,.55)}
  .side{--fs:calc(9px*var(--k));line-height:1.35;text-align:right;padding-top:2px}
  .tags{display:flex;align-items:center;gap:10px;margin-top:10px;--fs:calc(12px*var(--k))}
  .tags .note{margin-left:auto;text-align:right;--fs:calc(9.5px*var(--k))}
  .frow{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
  .fl,.fr{--fs:calc(10.5px*var(--k))}
  .fl{position:relative}
  #wc{position:absolute;pointer-events:none}
  .fr{text-align:right}
  .word{--fs:clamp(24px,7.4vw,38px);--lsb:-.055em;font-weight:800;line-height:1;margin:9px 0 7px;color:transparent}
  .desc{--fs:calc(9.5px*var(--k));--lsb:0px;font-weight:400;line-height:1.55;color:#7b7b7b;max-width:215px}

  .overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .overlay.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{position:relative;width:300px;max-width:100%;max-height:84vh;overflow:auto;background:#fff;font-size:8.5px;color:#3b3b3b;
    border:0;border-radius:14px;box-shadow:0 0 14px rgba(205,205,205,.55);padding:20px 20px 18px}
  .overlay.open .card{animation:pop .22s ease}
  @keyframes pop{from{transform:translateY(6px) scale(.98)}to{transform:none}}
  .close{position:absolute;top:8px;right:9px;width:26px;height:26px;border:0;background:transparent;
    font-size:18px;line-height:1;color:var(--sub);cursor:pointer;border-radius:7px}
  .close:hover{background:var(--chip)}
  .card .meta{margin-bottom:11px;padding-right:24px;display:block}
  .card .id-row{margin-bottom:10px}
  .card .label{font-size:8.5px;color:#999;letter-spacing:1px;margin-bottom:2px;font-weight:500}
  .card .para{margin-bottom:9px}
  .card .para .n{font-size:9.5px}
  .card .ln{line-height:1.5;margin-bottom:6px}
  .card hr{border:0;border-top:1px solid #3b3b3b;margin:11px 0 12px}
  .card .two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .card .tag{background:#3b3b3b;color:#fff;padding:.2px 2.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .card .g{font-size:9px;color:#999}
  .card b{font-weight:700}
  .card>:last-child{margin-bottom:0}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="contact"></div>
<canvas id="gl"></canvas>
<div id="fade"></div>
<div id="hair"></div>
<canvas id="shards"></canvas>
<svg id="lines"></svg>
<div id="labels"></div>
<div class="top">
  <div class="dmeta"><span data-t="kicker"></span><span data-t="issue"></span><span data-t="date"></span></div>
  <div class="hero"><h1 class="title" data-t="title"></h1><div class="side" data-t="sub"></div></div>
  <div class="tags"><span data-t="tagA"></span><span data-t="tagB"></span><span class="note" data-t="sideNote"></span></div>
</div>
<div class="foot">
  <div class="frow">
    <div class="fl"><div data-t="badge"></div><div class="word" data-t="wordmark"></div><p class="desc" data-t="desc"></p><canvas id="wc"></canvas></div>
    <div class="fr"><div data-t="chip2"></div></div>
  </div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="card" id="card"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PRESET = {"TEXTS": {"kicker": "Eternity", "issue": "unlessfarewell", "date": "centercore", "title": "", "sub": "to / my / commander\nsincerely yours;", "tagA": "", "tagB": "", "sideNote": "If only oblivion were mercy⋯.", "badge": "@cisqure", "wordmark": "Broken-wings®", "desc": "Nevertheless, the age we hold ever so near and love beyond measure remains as dear as ever.", "chip2": "Hyperventilation"}, "STY": {"kicker": {"m": 0.9, "sp": -0.5, "b": false, "i": false}, "issue": {"m": 0.8, "sp": -0.5, "b": false, "i": false}, "date": {"m": 1, "sp": -0.5, "b": true, "i": false}, "title": {"m": 0.3, "sp": 0, "b": true, "i": false}, "sub": {"m": 1, "sp": -0.5, "b": false, "i": false}, "tagA": {"m": 1, "sp": 0, "b": false, "i": false}, "tagB": {"m": 1, "sp": 0, "b": false, "i": false}, "sideNote": {"m": 0.95, "sp": -0.5, "b": false, "i": false}, "badge": {"m": 1, "sp": -0.5, "b": false, "i": false}, "wordmark": {"m": 1, "sp": -0.5, "b": true, "i": false}, "desc": {"m": 1, "sp": -0.5, "b": false, "i": false}, "chip2": {"m": 1, "sp": -0.5, "b": false, "i": false}}, "FX": {"shade": 1.4, "refl": 0.35, "scat": 2, "grain": 3, "count": 68}};
const EDIT_MODE = false;
const TEXTS = {
  kicker:"Eternity®", issue:"Vol.01 — Silver", date:"2026.10.14", title:"Silver\nButterfly!", sub:"Wing / Dust /\nLight, Silence",
  tagA:"Eternity", tagB:"Butterfly", sideNote:"the sky's only silver!",
  badge:"SILVER EDITION", wordmark:"Silver Butterfly®",
  desc:"A tiny silver butterfly that floats, glows and sheds dust as it goes. Model SB-01 · first drop 2026.", chip2:"SHINE IN THE DARK"
};
const LABELS = {
  kicker:"맨 위 왼쪽", issue:"맨 위 가운데", date:"맨 위 오른쪽 날짜", title:"큰 제목", sub:"제목 오른쪽 작은 글",
  tagA:"태그 글 1", tagB:"태그 글 2", sideNote:"태그 줄 오른쪽 한마디",
  badge:"왼쪽 아래 작은 글", wordmark:"왼쪽 아래 큰 이름", desc:"왼쪽 아래 설명", chip2:"오른쪽 아래 글"
};
const DEF = {...TEXTS};   // 비웠을 때 자리를 유지하기 위한 기본 문구
const STY = {};   // 글자별 크기 배율(m) / 자간(sp, px) / 볼드(b) / 기울임(i)
const sty = k => { const s = STY[k] || (STY[k]={m:1,sp:0}); if(s.b==null) s.b = (k==="title"||k==="wordmark"); if(s.i==null) s.i = false; return s; };
function rnd(x,y){ let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+1274126177)|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
/* 왼쪽 아래 이름: 젖빛유리(픽셀 흩뿌리기) - 캔버스라 모바일 사파리에서도 동작 */
function renderScatter(){
  const wc=document.getElementById("wc"), w=document.querySelector(".word"); if(!wc||!w) return;
  const fl=w.parentElement.getBoundingClientRect(), r=w.getBoundingClientRect(), cs=getComputedStyle(w);
  const D=Math.min(devicePixelRatio||1,2), R=Math.max(0,FX.scat)/2, pad=Math.ceil(R)+2;
  const W=Math.ceil(r.width)+pad*2, H=Math.ceil(r.height)+pad*2;
  wc.style.left=(r.left-fl.left-pad)+"px"; wc.style.top=(r.top-fl.top-pad)+"px"; wc.style.width=W+"px"; wc.style.height=H+"px";
  wc.style.visibility=w.style.visibility;
  wc.width=Math.round(W*D); wc.height=Math.round(H*D);
  const c=wc.getContext("2d"); c.scale(D,D);
  const fs=parseFloat(cs.fontSize);
  c.font=cs.fontStyle+" "+cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily; c.fillStyle="#151515";
  const sp=parseFloat(cs.letterSpacing)||0, lines=w.textContent.split("\n"), lh=parseFloat(cs.lineHeight)||fs;
  lines.forEach((ln,i)=>{ let x=pad; const y=pad+lh*i+lh*.5+fs*.35; for(const ch of ln){ c.fillText(ch,x,y); x+=c.measureText(ch).width+sp; } });
  if(R<=.2) return;
  const Wp=wc.width, Hp=wc.height, src=c.getImageData(0,0,Wp,Hp).data, out=c.createImageData(Wp,Hp), o=out.data;
  const cell=Math.max(1,Math.round(1.5/Math.max(.2,FX.grain))), RR=R*D;
  for(let y=0;y<Hp;y++)for(let x=0;x<Wp;x++){
    const cx=Math.floor(x/cell), cy=Math.floor(y/cell);
    const sx=Math.min(Wp-1,Math.max(0,Math.round(x+(rnd(cx,cy)-.5)*2*RR)));
    const sy=Math.min(Hp-1,Math.max(0,Math.round(y+(rnd(cx+977,cy+313)-.5)*2*RR)));
    const a=(sy*Wp+sx)*4, b=(y*Wp+x)*4; o[b]=src[a]; o[b+1]=src[a+1]; o[b+2]=src[a+2]; o[b+3]=src[a+3];
  }
  c.setTransform(1,0,0,1,0,0); c.putImageData(out,0,0);
}
function applyTexts(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k=el.dataset.t; if(!(k in TEXTS)) return;
    const on = TEXTS[k].trim(); const txt = on ? TEXTS[k] : DEF[k];
    if(k==="issue"){
      /* ( unlessfarewell ) : 괄호는 바로 서고, 영어만 기울임 */
      el.textContent="";
      const a=document.createElement("span"); a.className="pr"; a.textContent="(";
      const m=document.createElement("i"); m.textContent=txt;
      const z=document.createElement("span"); z.className="pr"; z.textContent=")";
      el.append(a,m,z);
    }else el.textContent = txt;
    el.style.visibility = on ? "" : "hidden";
    const s=sty(k); el.style.setProperty("--m",s.m); el.style.setProperty("--sp",s.sp+"px");
    const rt=["date","sub","sideNote"].includes(k); el.style.fontWeight = s.b ? (k==="title"?900:rt?600:800) : (k==="desc"||rt?400:500); el.style.fontStyle = s.i ? "italic" : "normal";
  });
  renderScatter();
}

const DEFAULT_HS = HOTSPOTS.map(h=>({label:h.label, html:h.html}));

const POSE = { yaw:-0.9, pitch:-0.2, roll:-0.45, fold:0.7 };

function wingShape(kind,s){
  const sh = new THREE.Shape(), X = v=>v*s;
  if(kind==="upper"){
    sh.moveTo(0,0.05);
    sh.bezierCurveTo(X(.3),1.2, X(1.6),2.4, X(3.1),2.85);
    sh.lineTo(X(3.7),3.2);
    sh.lineTo(X(3.5),2.45);
    sh.bezierCurveTo(X(3.4),1.5, X(3.0),.7, X(2.2),.1);
    sh.bezierCurveTo(X(1.5),-.2, X(.6),-.15, 0,0.05);
  }else{
    const th=-1.45, c=Math.cos(th), n=Math.sin(th);
    const T=(x,y)=>[X(.85*(x*c-y*n)), .85*(x*n+y*c)];
    const M=(x,y)=>sh.moveTo(...T(x,y)), L=(x,y)=>sh.lineTo(...T(x,y));
    const B=(a,b,c2,d,e,f)=>sh.bezierCurveTo(...T(a,b),...T(c2,d),...T(e,f));
    M(0,0.05);
    B(.3,1.2, 1.6,2.4, 3.1,2.85);
    L(3.7,3.2);
    L(3.5,2.45);
    B(3.4,1.5, 3.0,.7, 2.2,.1);
    B(1.5,-.2, .6,-.15, 0,0.05);
  }
  return sh;
}

function wingTextures(kind){
  const pts = wingShape(kind,1).getPoints(90);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)});
  const w=maxX-minX, h=maxY-minY, W=1024, H=Math.round(W*h/w);
  const P = (x,y)=>[(x-minX)/w*W,(1-(y-minY)/h)*H];
  const O = P(0, kind==="upper"?.05:0);
  const pp = pts.map(p=>P(p.x,p.y));
  const maxR = Math.max(...pp.map(p=>Math.hypot(p[0]-O[0],p[1]-O[1])));
  const mc=document.createElement("canvas"); mc.width=W; mc.height=H;
  const m=mc.getContext("2d");
  m.fillStyle="#fff"; m.fillRect(0,0,W,H);
  m.save(); m.beginPath(); pp.forEach((p,i)=>i?m.lineTo(p[0],p[1]):m.moveTo(p[0],p[1])); m.closePath(); m.clip();
  const g1=m.createRadialGradient(O[0],O[1],maxR*.5,O[0],O[1],maxR);
  g1.addColorStop(0,"rgba(40,40,40,0)"); g1.addColorStop(.62,"rgba(40,40,40,.03)"); g1.addColorStop(1,"rgba(24,24,24,.55)");
  m.fillStyle=g1; m.fillRect(0,0,W,H);
  m.restore();
  const map = new THREE.CanvasTexture(mc); map.encoding = THREE.sRGBEncoding; map.anisotropy = 8;

  const NW=512, NH=Math.max(64,Math.round(NW*h/w)), sc=NW/W;
  const nc=document.createElement("canvas"); nc.width=NW; nc.height=NH;
  const nctx=nc.getContext("2d"), img=nctx.createImageData(NW,NH);
  const ox=O[0]*sc, oy=O[1]*sc, K=3.2;
  const hf=(x,y)=>{const dx=x-ox,dy=y-oy,r=Math.hypot(dx,dy),th=Math.atan2(dy,dx);
    return 14*Math.sin(th*K)*Math.min(1,r/80)+0.0009*r*r;};
  for(let y=0;y<NH;y++)for(let x=0;x<NW;x++){
    const dhx=(hf(x+1,y)-hf(x-1,y))/2, dhy=(hf(x,y+1)-hf(x,y-1))/2;
    let nx=-dhx, ny=dhy, nz=1; const l=Math.hypot(nx,ny,nz); nx/=l;ny/=l;nz/=l;
    const i=(y*NW+x)*4; img.data[i]=(nx*.5+.5)*255; img.data[i+1]=(ny*.5+.5)*255; img.data[i+2]=(nz*.5+.5)*255; img.data[i+3]=255;
  }
  nctx.putImageData(img,0,0);
  const normal = new THREE.CanvasTexture(nc); normal.anisotropy = 8;
  return {map, normal, minX, minY, w, h};
}

const texUp = wingTextures("upper"), texLo = wingTextures("lower");
const geoCache = {}, matCache = {};
function wingMesh(kind,s,tex){
  const k = kind+s;
  if(!geoCache[k]){
    const geo = new THREE.ExtrudeGeometry(wingShape(kind,s),{depth:.04,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:5,curveSegments:48});
    const pos = geo.attributes.position, uv = geo.attributes.uv;
    for(let i=0;i<pos.count;i++) uv.setXY(i,(pos.getX(i)*s-tex.minX)/tex.w,(pos.getY(i)-tex.minY)/tex.h);
    uv.needsUpdate = true; geo.translate(0,0,-.02);
    geoCache[k] = geo;
  }
  if(!matCache[kind]) matCache[kind] = silverMat(tex);
  return new THREE.Mesh(geoCache[k], matCache[kind]);
}

function makeButterfly(){
  const root = new THREE.Group(); root.rotation.order = "ZXY";
  const wR = new THREE.Group(), wL = new THREE.Group();
  [wR,wL].forEach((w,i)=>{
    const s = i? -1:1;
    w.position.y = .45;
    const up = wingMesh("upper",s,texUp), lo = wingMesh("lower",s,texLo);
    lo.position.z = -.045; w.add(up,lo); root.add(w);
  });
  const body = new THREE.Group(); root.add(body);
  const part = (y,sx,sy,sz)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),bodyMat);m.position.y=y;m.scale.set(sx,sy,sz);body.add(m);};
  part(.55,.16,.5,.16); part(-.85,.12,1.05,.12); part(1.2,.16,.16,.16);
  [1,-1].forEach(s=>{
    const c = new THREE.CatmullRomCurve3([new THREE.Vector3(s*.05,1.3,0),new THREE.Vector3(s*.2,1.9,.05),new THREE.Vector3(s*.5,2.4,.1),new THREE.Vector3(s*.8,2.6,.1)]);
    body.add(new THREE.Mesh(new THREE.TubeGeometry(c,40,.016,8),darkMat));
    const tip = new THREE.Mesh(new THREE.SphereGeometry(.045,16,16),bodyMat); tip.position.set(s*.8,2.6,.1); body.add(tip);
  });
  return {root,wR,wL,body};
}

function setPose(b,rx,ry,t,a,py=0){

}

let FLOOR_Y = 1e9, FLOOR_X = 0;
(function findFloor(){
  const p = new THREE.Vector3();
  [-.22,0,.22].forEach(ry=>[.5,.7,.9].forEach(a=>{
    setPose(main,0,ry,0,a); main.root.updateMatrixWorld(true);
    let minY=1e9,minX=0;
    main.root.traverse(o=>{
      if(!o.isMesh) return;
      const pa=o.geometry.attributes.position;
      for(let i=0;i<pa.count;i+=2){ p.fromBufferAttribute(pa,i).applyMatrix4(o.matrixWorld); if(p.y<minY){minY=p.y;minX=p.x;} }
    });
    if(minY<FLOOR_Y) FLOOR_Y=minY;
    if(ry===0&&a===.7) FLOOR_X=minX;
  }));
  FLOOR_Y -= 0.12;
  mirrorRoot.scale.set(1,-1,1);
  mirrorRoot.position.y = 2*FLOOR_Y;
})();

/* 반사가 본체와 겹치지 않게: 매 프레임 본체의 가장 낮은 점을 재서 바닥 위로 띄움 */
const lowPts = [], tv = new THREE.Vector3();
(function(){
  const sp = new THREE.SphereGeometry(1,12,8).attributes.position;
  main.root.traverse(o=>{
    if(!o.isMesh) return;
    const g=o.geometry, pr=g.parameters, pts=[];
    if(g.type==="SphereGeometry" && pr.radius===1) for(let i=0;i<sp.count;i++) pts.push(new THREE.Vector3().fromBufferAttribute(sp,i));
    else if(g.type==="ExtrudeGeometry") [].concat(pr.shapes).forEach(s=>s.getPoints(40).forEach(p=>pts.push(new THREE.Vector3(p.x,p.y,0))));
    if(pts.length) lowPts.push([o,pts]);
  });
})();
function lowestY(){
  let m=1e9;
  for(const [o,pts] of lowPts) for(const p of pts){ tv.copy(p).applyMatrix4(o.matrixWorld); if(tv.y<m) m=tv.y; }
  return m;
}

const shardCanvas = document.getElementById("shards"), sctx = shardCanvas.getContext("2d");
let SW = 0, SH = 0, DPR = 1;
const shards = [];
function makeShard(initial){
  const depth = Math.random();
  const size  = 2.2 + depth*depth*7 + Math.random()*2.2;
  const n = 4 + Math.floor(Math.random()*3), st = Math.random()*Math.PI*2, sq = .35 + Math.random()*.65;
  const pts = Array.from({length:n},(_,i)=>{
    const a = st + (i + (Math.random()-.5)*.7)/n*Math.PI*2, r = size*(.45 + Math.random()*.85);
    return [Math.cos(a)*r*sq, Math.sin(a)*r];
  });
  const vy = SHARD.minV + depth*(SHARD.maxV-SHARD.minV);
  const s = { depth, size, pts, vy, vx:vy*SHARD.wind, rot:Math.random()*Math.PI*2,
              spin:(Math.random()<.5?-1:1)*(.25+Math.random()*.9), ph:Math.random()*Math.PI*2,
              flip:.6+Math.random()*1.2, alpha:.55+depth*.45, x:0, y:0 };
  placeShard(s,initial); return s;
}
function placeShard(s,initial){
  const drift = Math.abs(SHARD.wind)*SH;
  const xMin = SHARD.wind<0 ? 0 : -drift, xMax = SHARD.wind<0 ? SW+drift : SW;
  s.x = xMin + Math.random()*(xMax-xMin);
  s.y = initial ? Math.random()*SH : -s.size*2 - Math.random()*SH*.25;
}
function initShards(){
  shards.length = 0;
  for(let i=0;i<SHARD.count;i++) shards.push(makeShard(true));
  shards.sort((a,b)=>a.depth-b.depth);
}
function applyFX(){
  const mk = `linear-gradient(to bottom,#000 calc(var(--fy) + 4px),rgba(0,0,0,${(.6*FX.refl).toFixed(3)}) calc(var(--fy) + 4px),rgba(0,0,0,${(.24*FX.refl).toFixed(3)}) calc(var(--fy) + (100vh - var(--fy))*.3),transparent calc(var(--fy) + (100vh - var(--fy))*.64))`;
  canvas.style.webkitMaskImage = canvas.style.maskImage = mk;
  renderScatter();
  if(FX.count!==shards.length){ SHARD.count=FX.count; initShards(); }
}
function stepShards(dt,t){
  sctx.clearRect(0,0,shardCanvas.width,shardCanvas.height);
  for(const s of shards){
    s.y += s.vy*dt; s.x += s.vx*dt + Math.sin(t*.7+s.ph)*7*dt; s.rot += s.spin*dt;
    if(s.y - s.size*2 > SH || s.x < -s.size*3 || s.x > SW+SH*Math.abs(SHARD.wind)+s.size*3){ placeShard(s,false); }
    const edge = Math.min(1, Math.max(0,(SH-s.y)/(SH*.14)), Math.max(0,(s.y+s.size*2)/(SH*.08)));
    const a = s.alpha*edge; if(a<=.01) continue;
    const fl = Math.max(.3, Math.abs(Math.cos(t*s.flip+s.ph)));
    sctx.save();
    sctx.translate(s.x*DPR, s.y*DPR); sctx.rotate(s.rot); sctx.scale(fl*DPR, DPR);
    sctx.beginPath();
    s.pts.forEach((p,i)=>i?sctx.lineTo(p[0],p[1]):sctx.moveTo(p[0],p[1])); sctx.closePath();
    sctx.shadowColor = `rgba(120,120,120,${.3*a})`;
    sctx.shadowBlur = (6+s.size*.6)*DPR*FX.shade;
    sctx.shadowOffsetX = 0; sctx.shadowOffsetY = .6*DPR;
    sctx.fillStyle = `rgba(255,255,255,${a})`; sctx.fill();
    sctx.shadowColor = "transparent"; sctx.shadowBlur = 0; sctx.shadowOffsetX = 0; sctx.shadowOffsetY = 0;
    sctx.beginPath(); sctx.moveTo(s.pts[0][0],s.pts[0][1]); sctx.lineTo(s.pts[1][0],s.pts[1][1]); sctx.lineTo(s.pts[2][0],s.pts[2][1]); sctx.closePath();
    sctx.fillStyle = `rgba(204,204,204,${.34*a})`; sctx.fill();
    sctx.restore();
  }
}

const v = new THREE.Vector3();
function updateOverlay(){
  const W = innerWidth, H = innerHeight, cx = W/2;
  const spread = Math.min(W*.3, 190);
  HOTSPOTS.forEach(h=>{
    anchors[h.id].getWorldPosition(v); v.project(camera);
    const ax = (v.x+1)/2*W, ay = (1-v.y)/2*H;
    const margin = 10, bw = h.btn.offsetWidth;
    let lx = h.side>0 ? Math.max(ax+50, cx+spread) : Math.min(ax-50, cx-spread);
    lx = h.side>0 ? Math.min(lx, W-margin-bw) : Math.max(lx, margin+bw);
    const ly = Math.min(Math.max(ay+h.dy, 50), H-60);
    const ex = ax + h.side*Math.min(34, Math.abs(lx-ax)/2);
    const sx = ax + (ex>ax?R:-R)*.7, sy = ay + (ly>ay?R:-R)*.7;
    h.path.setAttribute("d",`M${sx},${sy} L${ex},${ly} L${lx},${ly}`);
    [h.pulse,h.ring,h.dot].forEach(c=>{c.setAttribute("cx",ax);c.setAttribute("cy",ay)});
    h.btn.style.transform = `translate(${h.side>0?lx:lx-bw}px,${ly-h.btn.offsetHeight/2}px)`;
  });
}

let dragging=false, lx0=0, ly0=0, rotY=0, rotX=0;
canvas.addEventListener("pointerdown",e=>{dragging=true;lx0=e.clientX;ly0=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  rotY += (e.clientX-lx0)*.008; rotX = Math.max(-.7,Math.min(.7,rotX+(e.clientY-ly0)*.006));
  lx0=e.clientX; ly0=e.clientY;
});

function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const ppu = Math.min(38, w/12.4, h/17);
  const dist = h/(2*Math.tan(THREE.MathUtils.degToRad(17.5))*ppu);
  camera.position.set(0, FLOOR_Y*.3, dist);
  camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  const f = new THREE.Vector3(FLOOR_X,FLOOR_Y,0).project(camera);
  const S = document.documentElement.style;
  S.setProperty("--fy",((1-f.y)/2*h)+"px"); S.setProperty("--fx",((f.x+1)/2*w)+"px");
  S.setProperty("--bw",(7.4*ppu)+"px");
  S.setProperty("--k", Math.min(1, Math.max(.88, w/640)).toFixed(3));
  DPR = Math.min(devicePixelRatio,2); SW = w; SH = h;
  shardCanvas.width = Math.round(w*DPR); shardCanvas.height = Math.round(h*DPR);
  if(!shards.length && SHARD.count>0) initShards();
}
addEventListener("resize",resize); resize();

let last = performance.now();
const t0 = last;
function tick(now){
  now = now || performance.now();
  const t = (now-t0)/1000, dt = Math.min((now-last)/1000,.05) || .016; last = now;
  if(!dragging){ rotY += (Math.sin(t*.45)*.22 - rotY)*.02; rotX += (0 - rotX)*.03; }
  const a = POSE.fold + Math.sin(t*1.7)*.2;
  setPose(main,rotX,rotY,t,a,0); main.root.updateMatrixWorld(true);
  const py = FLOOR_Y + .12 + (Math.sin(t*1.1)+1)*.05 - lowestY();   // 가장 낮은 점이 항상 바닥보다 위
  setPose(main,rotX,rotY,t,a,py); setPose(mir,rotX,rotY,t,a,py);
  glint1.position.set(Math.cos(t*.5)*7, 3+Math.sin(t*.7)*3, 6);
  glint2.position.set(-Math.cos(t*.4+2)*7, -1+Math.sin(t*.6)*2, 5);
  renderer.render(scene,camera);
  stepShards(dt,t);
  updateOverlay();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
